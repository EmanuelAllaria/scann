services:
  - type: web
    name: scan_invoice
    env: docker  # ⚠️ Cambia a Docker en vez de Python
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "8000"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ORG
        sync: false
